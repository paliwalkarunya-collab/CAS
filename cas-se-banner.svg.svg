<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <path d="M 0,105 L 1200,105 M 0,210 L 1200,210 M 0,315 L 1200,315 M 0,420 L 1200,420 M 0,525 L 1200,525" />
    <path d="M 200,0 L 200,630 M 400,0 L 400,630 M 600,0 L 600,630 M 800,0 L 800,630 M 1000,0 L 1000,630" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="1050" cy="120" r="180" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle cx="150" cy="520" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Main Card Container -->
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Top Accent Header Bar -->
  <rect x="50" y="50" width="1100" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- University Badge -->
  <g transform="translate(90, 95)">
    <rect x="0" y="0" width="320" height="34" rx="17" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="18" y="22" fill="#60a5fa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">RAMDEOBABA UNIVERSITY • AIML</text>
  </g>

  <!-- Title -->
  <text x="90" y="185" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">CAS-SE</text>

  <!-- Subtitle -->
  <text x="90" y="225" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20" font-weight="600">Context-Aware, Searchable, Split-Key Data Envelope Architecture</text>

  <!-- Core Security Pills -->
  <g transform="translate(90, 255)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="185" height="34" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
    <text x="16" y="22" fill="#34d399" font-family="Arial, sans-serif" font-size="13" font-weight="bold">🔒 AES-256-GCM</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="170" height="34" rx="8" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1" />
    <text x="212" y="22" fill="#60a5fa" font-family="Arial, sans-serif" font-size="13" font-weight="bold">🔍 HMAC Search</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="185" height="34" rx="8" fill="rgba(236, 72, 153, 0.12)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1" />
    <text x="392" y="22" fill="#f472b6" font-family="Arial, sans-serif" font-size="13" font-weight="bold">🗝️ 2-of-3 Shamir</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="165" height="34" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1" />
    <text x="587" y="22" fill="#fbbf24" font-family="Arial, sans-serif" font-size="13" font-weight="bold">🛡️ OPA & ABAC</text>
  </g>

  <!-- 4-Step Pipeline Flow Cards -->
  <g transform="translate(90, 320)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="225" height="120" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="18" y="32" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">01. INGESTION</text>
    <text x="18" y="62" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Per-Record DEK</text>
    <text x="18" y="86" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">AES-256-GCM Encryption</text>

    <!-- Arrow 1 -->
    <path d="M 237,60 L 253,60 M 245,52 L 253,60 L 245,68" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Step 2 -->
    <rect x="265" y="0" width="225" height="120" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="283" y="32" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">02. TOKENIZE</text>
    <text x="283" y="62" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">HMAC-SHA-256</text>
    <text x="283" y="86" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Protected Equality Search</text>

    <!-- Arrow 2 -->
    <path d="M 502,60 L 518,60 M 510,52 L 518,60 L 510,68" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Step 3 -->
    <rect x="530" y="0" width="225" height="120" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="548" y="32" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">03. POLICY (ABAC)</text>
    <text x="548" y="62" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Context Evaluation</text>
    <text x="548" y="86" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Automated Minimization</text>

    <!-- Arrow 3 -->
    <path d="M 767,60 L 783,60 M 775,52 L 783,60 L 775,68" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Step 4 -->
    <rect x="795" y="0" width="185" height="120" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="813" y="32" fill="#34d399" font-family="Arial, sans-serif" font-size="13" font-weight="bold">04. AUDIT</text>
    <text x="813" y="62" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Hash-Chained</text>
    <text x="813" y="86" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Tamper Detection</text>
  </g>

  <!-- Footer Tagline -->
  <text x="90" y="500" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16" font-weight="bold">"Privacy and Utility Can Coexist."</text>
  <text x="980" y="500" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="600">v0.1.0 • Open Source</text>
</svg>